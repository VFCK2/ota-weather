<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="no"><meta name="robots" content="noindex,nofollow"><title>O-SORA 現在地取得</title><style>*{box-sizing:border-box}body{margin:0;padding:calc(env(safe-area-inset-top) + 24px) 18px 24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef7ff;color:#183246}.wrap{max-width:520px;margin:auto}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(30,70,100,.12)}h1{font-size:22px;margin:0 0 8px}.sub{font-size:14px;line-height:1.7;color:#607789}.btn{width:100%;margin-top:18px;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:800;background:#1f6feb;color:#fff}.status{margin-top:16px;padding:14px;border-radius:14px;background:#f2f6f9;font-size:14px;line-height:1.7;white-space:pre-wrap}</style></head><body><div class="wrap"><div class="card"><h1>O-SORA 現在地取得</h1><div class="sub">このページはSafariで開いてください。位置情報を取得してO-SORAへ渡します。</div><button class="btn" id="btn">📍現在地を取得</button><div class="status" id="status">待機中</div></div></div><script>
const GAS='https://script.google.com/macros/s/AKfycbxNgg7izI18Yxk36hyzfGe8GhVUlQvXKCbkKSIcMRtKUEwsjTvZcFUNxoqqLQFLoJJMng/exec';
const token=new URLSearchParams(location.search).get('token')||''; const ret=new URLSearchParams(location.search).get('return')||'/';
const btn=document.getElementById('btn'),status=document.getElementById('status');
function st(x){status.textContent=x}
btn.onclick=function(){if(!navigator.geolocation){st('このSafariでは位置情報を利用できません');return}btn.disabled=true;st('現在地を取得中…');navigator.geolocation.getCurrentPosition(async p=>{const c=p.coords;st('取得成功。O-SORAへ渡しています…');const cb='save_'+Date.now();window[cb]=function(){delete window[cb];st('完了。O-SORAへ戻ってください。');setTimeout(()=>location.href=ret,700)};const s=document.createElement('script');s.src=GAS+'?action=gpsSave&token='+encodeURIComponent(token)+'&lat='+encodeURIComponent(c.latitude)+'&lon='+encodeURIComponent(c.longitude)+'&accuracy='+encodeURIComponent(c.accuracy||0)+'&callback='+cb+'&_='+Date.now();s.onerror=()=>{delete window[cb];btn.disabled=false;st('O-SORAへの受け渡しに失敗しました。GAS設定を確認してください。')};document.head.appendChild(s)},e=>{btn.disabled=false;st(e.code===1?'位置情報の許可がありません（エラー1）':e.code===2?'位置情報を取得できません（エラー2）':e.code===3?'GPSタイムアウト（エラー3）':'GPSエラー')},{enableHighAccuracy:false,timeout:18000,maximumAge:0})}
</script></body></html>
