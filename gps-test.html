<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="O-SORA GPS TEST">
<link rel="manifest" href="./gps-test-manifest.json">
<title>O-SORA GPS TEST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef7ff;color:#183246}body{padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:auto}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(30,70,100,.12)}h1{font-size:22px;margin:0 0 8px}.sub{font-size:13px;line-height:1.6;color:#607789;margin-bottom:18px}.btn{width:100%;border:0;border-radius:16px;padding:17px 16px;font-size:18px;font-weight:800;background:#1f6feb;color:#fff;touch-action:manipulation}.btn:disabled{opacity:.65}.status{margin-top:16px;padding:14px;border-radius:14px;background:#f2f6f9;font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:82px}.small{margin-top:14px;font-size:12px;color:#708392;line-height:1.6}
#toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 88px);z-index:20;background:rgba(20,35,50,.96);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.22);display:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap"><div class="card">
<h1>O-SORA GPS TEST</h1>
<div class="sub">これはO-SORA本体からGPS処理を切り離した診断ページです。天気取得やGASは使いません。</div>
<button class="btn" id="gpsBtn" type="button">📍 位置情報を取得</button>
<div class="status" id="status">待機中</div>
<div class="small" id="env"></div>
</div></div>
<script>
(function(){
 const btn=document.getElementById('gpsBtn'), status=document.getElementById('status'), toast=document.getElementById('toast'), env=document.getElementById('env');
 const standalone=window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches;
 env.textContent='secure: '+location.protocol+' / standalone: '+standalone+' / geolocation: '+(!!navigator.geolocation);
 function show(msg){status.textContent=msg;toast.textContent=msg;toast.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>toast.style.display='none',3500)}
 btn.addEventListener('click',()=>{
   if(!navigator.geolocation){show('Geolocation APIがありません');return}
   btn.disabled=true;show('GPS要求を開始しました…');
   let done=false;
   const timer=setTimeout(()=>{if(done)return;done=true;btn.disabled=false;show('20秒経過。GPSから応答がありません。');},20000);
   navigator.geolocation.getCurrentPosition(pos=>{
     if(done)return;done=true;clearTimeout(timer);btn.disabled=false;
     const c=pos.coords; const msg='GPS取得成功\n緯度: '+c.latitude.toFixed(6)+'\n経度: '+c.longitude.toFixed(6)+'\n精度: '+Math.round(c.accuracy)+' m';
     show(msg);
   },err=>{
     if(done)return;done=true;clearTimeout(timer);btn.disabled=false;
     const m={1:'位置情報の許可がありません（エラー1）',2:'位置情報を取得できません（エラー2）',3:'GPSタイムアウト（エラー3）'}[err.code]||('GPSエラー（'+err.code+'）');
     show(m);
   },{enableHighAccuracy:false,timeout:18000,maximumAge:0});
 });
})();
</script>
</body></html>
