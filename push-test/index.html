<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="O-SORA Push Test">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>O-SORA Push Test</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OSoraOneSignalReady = new Promise(function(resolve, reject) {
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({
        appId: "5c572571-87e6-426b-a615-513025c5947a",
        serviceWorkerPath: "ota-weather/push-test/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/ota-weather/push-test/" },
        autoResubscribe: true,
        welcomeNotification: { disable: true },
        notifyButton: { enable: false }
      });
      resolve(OneSignal);
    } catch (error) {
      reject(error);
    }
  });
});
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f5faff;color:#17212b}
body{padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:48px 0}
.logo{font-weight:800;letter-spacing:.12em;font-size:30px}
.sub{margin-top:6px;color:#637386}
.card{margin-top:28px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
button{width:100%;border:0;border-radius:16px;padding:17px 14px;font-size:17px;font-weight:700;background:#17212b;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.status{margin-top:18px;line-height:1.9;background:#f2f6fa;border-radius:14px;padding:15px;font-size:14px;overflow-wrap:anywhere}
.note{margin-top:18px;font-size:13px;line-height:1.7;color:#637386}
.error{white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">O-SORA</div>
  <div class="sub">Web Push テスト v5</div>
  <div class="card">
    <button id="pushBtn" disabled>OneSignalを読み込み中…</button>
    <div id="status" class="status">OneSignalを読み込み中…</div>
    <div class="note">OneSignal Web Pushだけを確認するテストページです。既存のO-SORA本体やGASには接続していません。</div>
  </div>
</div>

<script>
(function(){
  const btn = document.getElementById('pushBtn');
  const status = document.getElementById('status');

  function showError(prefix, error){
    const message = error && error.message ? error.message : String(error || '不明なエラー');
    console.error(prefix, error);
    status.className = 'status error';
    status.textContent = prefix + '\n' + message;
    btn.disabled = false;
    btn.textContent = '🔔 もう一度試す';
  }

  async function drawState(OneSignal){
    try {
      const supported = !!(OneSignal.Notifications && OneSignal.Notifications.isPushSupported && OneSignal.Notifications.isPushSupported());
      const permission = OneSignal.Notifications ? OneSignal.Notifications.permission : false;
      const sub = OneSignal.User && OneSignal.User.PushSubscription;
      const optedIn = !!(sub && sub.optedIn);
      const id = sub && sub.id ? sub.id : '';

      status.className = 'status';
      status.innerHTML =
        'Web Push対応: <b>' + (supported ? '○ 対応' : '× 非対応') + '</b><br>' +
        '通知許可: <b>' + (permission ? '○ 許可済み' : '△ 未許可') + '</b><br>' +
        '購読: <b>' + (optedIn ? '○ 登録済み' : '△ 未登録') + '</b>' +
        (id ? '<br>Subscription ID: <code>' + id.replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}) + '</code>' : '');

      if(optedIn){
        btn.textContent = '✅ 通知は有効です';
        btn.disabled = true;
      }else{
        btn.textContent = permission ? '🔔 通知を登録する' : '🔔 通知を有効にする';
        btn.disabled = false;
      }
    }catch(error){
      showError('状態取得エラー', error);
    }
  }

  async function enablePush(){
    try{
      btn.disabled = true;
      btn.textContent = '通知を設定中…';
      const OneSignal = await window.OSoraOneSignalReady;

      if(!OneSignal.Notifications.isPushSupported()){
        throw new Error('この環境ではWeb Pushに対応していません。iPhoneはホーム画面に追加したWebアプリから開いてください。');
      }

      await OneSignal.Notifications.requestPermission();
      await new Promise(function(resolve){ setTimeout(resolve, 800); });
      await drawState(OneSignal);
    }catch(error){
      showError('OneSignal設定エラー', error);
    }
  }

  btn.addEventListener('click', enablePush);

  window.OSoraOneSignalReady.then(function(OneSignal){
    const sub = OneSignal.User && OneSignal.User.PushSubscription;
    if(sub && sub.addEventListener){
      sub.addEventListener('change', function(){ drawState(OneSignal); });
    }
    if(OneSignal.Notifications && OneSignal.Notifications.addEventListener){
      OneSignal.Notifications.addEventListener('permissionChange', function(){ drawState(OneSignal); });
    }
    drawState(OneSignal);
  }).catch(function(error){
    showError('OneSignal初期化エラー', error);
  });
})();
</script>
</body>
</html>
