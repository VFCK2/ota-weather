<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><title>大田区 超局地天気 v0.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#152033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#0b1220;color:#fff;padding:16px}.sub{font-size:11px;opacity:.7}h1{font-size:21px;margin:0 0 3px}
main{max-width:760px;margin:auto;padding:12px 10px 28px}.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 2px 12px #0000000b}
.now{display:grid;grid-template-columns:1fr auto;align-items:center}.label{font-size:11px;color:#687385}.temp{font-size:44px;font-weight:800}.weather{font-size:15px}.updated{font-size:10px;color:#718096}
.score{font-size:32px;font-weight:800}.advice{font-size:12px;font-weight:700}h2{font-size:15px;margin:0 0 10px}
.map{height:390px;border-radius:14px;overflow:hidden;background:#dfe7ef}.mapbar,.controls{display:flex;gap:6px;align-items:center;margin-top:8px}
button{border:0;border-radius:10px;padding:9px 10px;background:#0b1220;color:#fff;font-weight:700}.secondary{background:#eef2f6;color:#263447}
.mapbar span,.controls span{font-size:11px;color:#667085}.mapbar span{margin-left:auto}.controls input{flex:1}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:#5d6877}.legend i{width:10px;height:10px;display:inline-block;border-radius:3px}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.slot{background:#f4f7fb;border-radius:11px;padding:8px 3px;text-align:center}
.time{font-size:10px;color:#667085}.rain{font-size:17px;font-weight:800;margin:4px 0}.mm{font-size:9px;color:#667085}.bar{height:7px;background:#e8edf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#377dff}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#f5f7fa;padding:10px;border-radius:11px}.metric b{display:block;font-size:17px;margin-top:3px}
.note,.status{font-size:10px;color:#667085;line-height:1.6}.status{text-align:center;margin-top:6px}
.leaflet-control-attribution{font-size:8px!important}
@media(max-width:500px){.map{height:340px}.timeline{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><h1>🌧 大田区 超局地天気</h1><div class="sub">気象庁 高解像度降水ナウキャスト × 独自雨判定　v0.3</div></header>
<main>
<section class="card now"><div><div class="label">大田区・現在</div><div id="temp" class="temp">--°</div><div id="weather" class="weather">読み込み中…</div><div id="updated" class="updated"></div></div>
<div style="text-align:right"><div class="label">雨リスク</div><div id="score" class="score">--%</div><div id="advice" class="advice">判定中</div></div></section>

<section class="card"><h2>🗺 大田区・雨雲レーダー</h2>
<div id="map" class="map"></div>
<div class="mapbar"><button id="play">▶ 雨雲を動かす</button><button id="nowBtn" class="secondary">現在</button><span id="radarTime">取得中…</span></div>
<div class="controls"><span>時間</span><input id="slider" type="range" min="0" max="0" value="0"><span id="frameLabel">--</span></div>
<div class="legend"><span><i style="background:#5bb8ff"></i>弱い雨</span><span><i style="background:#24c66b"></i>雨</span><span><i style="background:#ffe14a"></i>強い雨</span><span><i style="background:#ff9b2f"></i>激しい雨</span><span><i style="background:#ed3b55"></i>非常に強い雨</span></div></section>

<section class="card"><h2>☔ 今後60分</h2><div id="timeline" class="timeline"></div></section>
<section class="card"><h2>📊 現在の観測</h2><div class="metrics">
<div class="metric"><span class="label">湿度</span><b id="humidity">--%</b></div><div class="metric"><span class="label">風</span><b id="wind">-- m/s</b></div><div class="metric"><span class="label">降水</span><b id="precip">-- mm</b></div></div></section>
<section class="card"><h2>🧠 独自雨判定</h2><p class="note">気象庁の高解像度降水ナウキャストを地図に直接重ねています。5分ごとに更新され、30分先まで250m格子、35〜60分先は1km格子です。</p></section>
<div id="status" class="status"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const LAT=35.5613,LON=139.7161;
const WMO={0:"快晴",1:"晴れ",2:"薄曇り",3:"曇り",45:"霧",48:"霧",51:"弱い霧雨",53:"霧雨",55:"霧雨",61:"弱い雨",63:"雨",65:"強い雨",80:"にわか雨",81:"にわか雨",82:"強いにわか雨",95:"雷雨",96:"雷雨",99:"強い雷雨"};
let map,radarLayers=[],frames=[],playing=false,timer=null,currentIndex=0;
function initMap(){map=L.map("map").setView([LAT,LON],12);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors",referrerPolicy:"strict-origin-when-cross-origin"}).addTo(map);L.circleMarker([LAT,LON],{radius:8,color:"#fff",weight:3,fillColor:"#1677ff",fillOpacity:1}).addTo(map).bindPopup("<b>📍 大田区</b><br>予報基準地点");}
function fmt(t){const d=new Date(t.slice(0,4)+"-"+t.slice(4,6)+"-"+t.slice(6,8)+"T"+t.slice(8,10)+":"+t.slice(10,12)+":"+t.slice(12,14)+"Z");return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});}
async function loadRadar(){try{
const [n1,n2]=await Promise.all([fetch("https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json").then(r=>r.json()),fetch("https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json").then(r=>r.json())]);
const past=n1.slice(0,13).reverse(),forecast=n2.slice().reverse();frames=[...past,...forecast];document.getElementById("slider").max=Math.max(0,frames.length-1);
radarLayers.forEach(l=>map.removeLayer(l));radarLayers=[];
frames.forEach(f=>radarLayers.push(L.tileLayer(`https://www.jma.go.jp/bosai/jmatile/data/nowc/${f.basetime}/none/${f.validtime}/surf/hrpns/{z}/{x}/{y}.png`,{opacity:.68,zIndex:20,minZoom:4,maxZoom:18,maxNativeZoom:10,attribution:"気象データ © Japan Meteorological Agency"})));
currentIndex=Math.min(12,frames.length-1);showFrame(currentIndex);document.getElementById("status").textContent="気象庁レーダー取得完了";
}catch(e){document.getElementById("status").textContent="レーダー取得失敗。再読み込みしてください。";console.error(e);}}
function showFrame(i){if(!frames.length)return;radarLayers.forEach((l,n)=>{if(n===i)l.addTo(map);else if(map.hasLayer(l))map.removeLayer(l)});currentIndex=i;document.getElementById("slider").value=i;document.getElementById("frameLabel").textContent=fmt(frames[i].validtime);document.getElementById("radarTime").textContent=(i<13?"実況 ":"予測 ")+fmt(frames[i].validtime);}
function togglePlay(){if(playing){clearInterval(timer);playing=false;document.getElementById("play").textContent="▶ 雨雲を動かす";return}playing=true;document.getElementById("play").textContent="⏸ 停止";timer=setInterval(()=>showFrame((currentIndex+1)%frames.length),650);}
document.getElementById("play").onclick=togglePlay;document.getElementById("nowBtn").onclick=()=>showFrame(Math.min(12,frames.length-1));document.getElementById("slider").oninput=e=>showFrame(+e.target.value);
async function loadWeather(){try{
const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&hourly=precipitation_probability,precipitation,weather_code&forecast_days=2&timezone=Asia%2FTokyo`;const d=await fetch(u).then(r=>r.json()),c=d.current,h=d.hourly;
document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°";document.getElementById("weather").textContent=WMO[c.weather_code]||"天気";document.getElementById("humidity").textContent=Math.round(c.relative_humidity_2m)+"%";document.getElementById("wind").textContent=(c.wind_speed_10m/3.6).toFixed(1)+" m/s";document.getElementById("precip").textContent=(c.precipitation||0).toFixed(1)+" mm";document.getElementById("updated").textContent="更新 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
let idx=h.time.findIndex(t=>new Date(t)>=new Date(Date.now()-1800000));if(idx<0)idx=0;let html="",maxP=0;for(let i=idx;i<idx+6&&i<h.time.length;i++){let p=h.precipitation_probability[i]||0,mm=h.precipitation[i]||0;maxP=Math.max(maxP,p);let dt=new Date(h.time[i]);html+=`<div class="slot"><div class="time">${dt.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</div><div class="rain">${p}%</div><div class="mm">${mm.toFixed(1)}mm</div><div class="bar"><i style="width:${p}%"></i></div></div>`}document.getElementById("timeline").innerHTML=html;
const rain=[51,53,55,61,63,65,80,81,82,95,96,99].includes(c.weather_code)?35:0;const score=Math.min(100,Math.max(maxP,rain+(c.precipitation>0?45:0)));document.getElementById("score").textContent=Math.round(score)+"%";document.getElementById("advice").textContent=score>=70?"☔ 傘がおすすめ":score>=35?"🌂 折りたたみ傘を検討":"☀️ 今は雨リスク低め";
}catch(e){console.error(e);}}
initMap();loadRadar();loadWeather();setInterval(()=>{loadRadar();loadWeather()},300000);
</script></body></html>
